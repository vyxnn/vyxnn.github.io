<h1 class="text-center fs-3 fw-bold">{{page.title}}</h1>
{%if page.date%}
    <p class="text-center" style="color: grey; font-size: smaller;">
        {% assign d = page.date | date: "%-d" %}
        {% case d %}{% when "1" or "21" or "31" %}{{ d }}st{% when "2" or "22" %}{{ d }}nd{% when "3" or "23" %}{{ d }}rd{% else %}{{ d }}th{% endcase %} 
        {{ page.date | date: "%B, %Y" }} 
    </p>
{%endif%}
